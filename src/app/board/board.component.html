<div class="page-actions">
  <button nbButton outline status="info" (click)="home()">Home</button>
</div>

<div *ngIf="playerCheck" class="main">
  <div class="div-row">
    <div class="div-col score-col">
      <nb-card status="basic">
        <nb-card-header>Player 1</nb-card-header>
        <nb-card-body>
          <h5 class="score-line">{{ player1 | titlecase }} is X</h5>
          <h5 class="score-line">Wins: {{ player1Count }}</h5>
        </nb-card-body>
      </nb-card>
    </div>
    <div class="div-col score-col">
      <nb-card status="basic">
        <nb-card-header>Player 2</nb-card-header>
        <nb-card-body>
          <h5 class="score-line">{{ player2 | titlecase }} is O</h5>
          <h5 class="score-line">Wins: {{ player2Count }}</h5>
        </nb-card-body>
      </nb-card>
    </div>
  </div>

  <div class="controls" aria-live="polite">
    <button class="control-btn" (click)="resetGame()" nbButton outline status="warning">Reset</button>
    <button class="control-btn" (click)="newGame()" nbButton outline status="danger">New Game</button>
    <h5 class="status-text">{{ statusMessage }}</h5>
  </div>

  <main class="board" [attr.aria-label]="'Tic Tac Toe board. ' + statusMessage">
    <app-square
      *ngFor="let square of squares; let i = index"
      [value]="square"
      [winner]="winner"
      [highlight]="isWinningSquare(i)"
      [ariaLabel]="squareLabel(i)"
      (click)="makeMove(i)"
    ></app-square>
  </main>

  <div *ngIf="gameOver" class="card-row">
    <div class="card-col result-card">
      <nb-card [status]="isDraw ? 'warning' : 'success'">
        <nb-card-header>Game Over</nb-card-header>
        <nb-card-body>
          <h4 class="result-text" *ngIf="winner === 'X'">{{ player1 | titlecase }} won the game.</h4>
          <h4 class="result-text" *ngIf="winner === 'O'">{{ player2 | titlecase }} won the game.</h4>
          <h4 class="result-text" *ngIf="isDraw">It is a draw.</h4>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>

<div *ngIf="!playerCheck" class="card-col setup-card">
  <nb-card status="danger">
    <nb-card-header>Player Setup</nb-card-header>
    <nb-card-body>
      <form #userForm="ngForm" (ngSubmit)="submitPlayerData(userForm.value)" ngNativeValidate>
        <label for="player1">Player 1 name</label>
        <input id="player1" name="player1" [ngModel]="player1" required class="setup-input" type="text" nbInput placeholder="Enter Player 1 name" />
        <label for="player2">Player 2 name</label>
        <input id="player2" name="player2" [ngModel]="player2" required class="setup-input" type="text" nbInput placeholder="Enter Player 2 name" />
        <button type="submit" class="submit-btn" nbButton status="success">Start</button>
      </form>
    </nb-card-body>
  </nb-card>
</div>
