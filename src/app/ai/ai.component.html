<div class="page-actions">
  <button nbButton outline status="info" (click)="home()">Home</button>
</div>

<div *ngIf="playerCheck" class="main">
  <div class="div-row">
    <div class="div-col score-col">
      <nb-card status="basic">
        <nb-card-header>Human</nb-card-header>
        <nb-card-body>
          <h5 class="score-line">{{ player1 | titlecase }} is {{ human }}</h5>
          <h5 class="score-line">Wins: {{ player1Count }}</h5>
        </nb-card-body>
      </nb-card>
    </div>
    <div class="div-col score-col">
      <nb-card status="basic">
        <nb-card-header>Computer</nb-card-header>
        <nb-card-body>
          <h5 class="score-line">{{ player2 }} is {{ ai }}</h5>
          <h5 class="score-line">Wins: {{ player2Count }}</h5>
        </nb-card-body>
      </nb-card>
    </div>
  </div>

  <div class="controls" aria-live="polite">
    <button class="control-btn" (click)="resetGame()" nbButton outline status="warning">Reset</button>
    <button class="control-btn" (click)="newGame()" nbButton outline status="danger">New Game</button>
    <h5 class="status-text">{{ statusMessage }}</h5>
  </div>

  <main class="board" [attr.aria-label]="'Tic Tac Toe vs computer. ' + statusMessage">
    <ng-container *ngFor="let row of squares; let i = index">
      <app-square
        *ngFor="let cell of row; let j = index"
        [value]="cell || null"
        [winner]="winner"
        [highlight]="isWinningCell(i, j)"
        [disabled]="currentPlayer !== human || gameOver"
        [ariaLabel]="cellLabel(i, j)"
        (click)="makeMove(i, j)"
      ></app-square>
    </ng-container>
  </main>

  <div *ngIf="gameOver" class="card-row">
    <div class="card-col result-card">
      <nb-card [status]="winner === 'tie' ? 'warning' : 'success'">
        <nb-card-header>Game Over</nb-card-header>
        <nb-card-body>
          <h4 class="result-text" *ngIf="winner === 'tie'">Match drawn.</h4>
          <h4 class="result-text" *ngIf="winner !== 'tie'">{{ winnerName | titlecase }} won the game.</h4>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>

<div *ngIf="!playerCheck" class="card-col setup-card">
  <nb-card status="danger">
    <nb-card-header>Player Setup</nb-card-header>
    <nb-card-body>
      <form #userForm="ngForm" (ngSubmit)="submitPlayerData(userForm.value)" ngNativeValidate>
        <label for="ai-player1">Player name</label>
        <input id="ai-player1" name="player1" [ngModel]="player1" required class="setup-input" type="text" nbInput placeholder="Enter your name" />

        <label for="startingPlayer">Starting player</label>
        <nb-select id="startingPlayer" required name="startingPlayer" class="setup-select" placeholder="Select starting player" [(selected)]="startingPlayer">
          <nb-option value="human">Human</nb-option>
          <nb-option value="ai">Computer</nb-option>
        </nb-select>

        <label for="level">Difficulty</label>
        <nb-select id="level" required name="level" class="setup-select" placeholder="Select difficulty" [(selected)]="level">
          <nb-option value="easy">Easy</nb-option>
          <nb-option value="insane">Insane</nb-option>
        </nb-select>

        <button type="submit" class="submit-btn" nbButton status="success">Start</button>
      </form>
    </nb-card-body>
  </nb-card>
</div>
